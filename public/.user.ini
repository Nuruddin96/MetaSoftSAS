; Shared-hosting (PHP-FPM) override — Hostinger's default upload_max_filesize
; (2M) and post_max_size (8M) are too small for a multi-image product
; gallery: a handful of real phone photos alone can exceed 8M, and any single
; photo over 2M is rejected outright. No php.ini or SSH access on shared
; hosting, so this is the standard PHP-FPM mechanism to raise the limits
; per-directory (picked up under public/, the document root).
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20
memory_limit = 256M
